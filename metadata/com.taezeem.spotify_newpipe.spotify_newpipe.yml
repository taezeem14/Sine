Name: Sine
Summary: High-fidelity, telemetry-free music streaming powered by YouTube & Piped
Description: |-
  Sine is a high-fidelity, privacy-first Android music streaming client
  built with NewPipe-inspired architecture.

  Features:
  * Zero ads, zero accounts, zero tracking or analytics
  * Pure YouTube & Piped audio streaming up to 160 kbps Opus / 128 kbps AAC
  * Native ExoPlayer hardware decoding with automatic stream failover
  * Synchronized lyrics via LRCLIB with offset calibration
  * Full offline downloads with embedded ID3 metadata and artwork
  * 6-band graph equalizer with dynamic peak headroom limiter
  * Smart sleep timer and gapless audio crossfade
  * Offline QR code playlist and track sharing
  * SponsorBlock segment skipping

RepoType: git
Repo: https://github.com/taezeem14/Sine.git

AntiFeatures:
  - NonFreeNet:
      en-US: Streams audio and metadata from YouTube/Google and public web services.

